name: Build, check and publish

on:
  push:
    branches:
      - main
      - portfolio-astro-v2

  pull_request:
    branches:
      - main
      - portfolio-astro-v2

  workflow_dispatch:
    inputs:
      publish_docker:
        description: "Build and publish the Docker image to GHCR"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Validate and build Astro portfolio
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build static portfolio
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Check internal links and assets
        run: npm run check:links

      - name: Upload built portfolio
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Build and publish Docker image
    needs: check
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_docker == true

    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/garv-portfolio

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test Docker image
        shell: bash
        run: |
          set -euo pipefail

          docker run -d \
            --name portfolio-test \
            -p 127.0.0.1:8080:80 \
            "$IMAGE_NAME:latest"

          cleanup() {
            docker rm -f portfolio-test >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then
              break
            fi

            if [ "$attempt" -eq 15 ]; then
              echo "Container did not become ready."
              docker logs portfolio-test
              exit 1
            fi

            sleep 2
          done

          curl --fail --silent http://127.0.0.1:8080/ |
            grep -q "Garv"

          curl --fail --silent --output /dev/null \
            http://127.0.0.1:8080/projects/sscprep/

          curl --fail --silent --output /dev/null \
            http://127.0.0.1:8080/resume/Garv_Gupta_Resume.pdf

          echo "Docker smoke tests passed."

      - name: Push Docker image tags
        shell: bash
        run: |
          set -euo pipefail

          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:$GITHUB_SHA"

          echo "Published:"
          echo "$IMAGE_NAME:latest"
          echo "$IMAGE_NAME:$GITHUB_SHA"

  publish-preview:
    name: Publish static preview branch
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      actions: read

    steps:
      - name: Download built portfolio
        uses: actions/download-artifact@v4
        with:
          name: portfolio-dist
          path: dist/

      - name: Publish preview files
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: portfolio-preview
          force_orphan: true
