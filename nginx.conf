# Server block for the nginx:alpine image (copied to /etc/nginx/conf.d/default.conf).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # Security headers. 'unsafe-inline' is needed only for Astro's small inline scripts and JSON-LD.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self' https:; frame-ancestors 'none'" always;

    # Old multi-file URLs from the previous site keep working.
    location = /about.html { return 301 /about/; }
    location = /education.html { return 301 /education/; }
    location = /projects.html { return 301 /projects/; }
    location = /skills.html { return 301 /skills/; }
    location = /contact.html { return 301 /contact/; }

    # Hashed build output never changes: cache for a year.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/portfolio-headers.conf;
    }
    location ~* \.(woff2|webp|svg|png|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/snippets/portfolio-headers.conf;
    }
    location = /resume/Garv_Gupta_Resume.pdf {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/portfolio-headers.conf;
    }

    # HTML is always revalidated so a new deploy shows up immediately.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/portfolio-headers.conf;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
